<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Move Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#17202a; --muted:#5d6b7a; --line:#d5dce3;
  --accent:#e0601f; --done:#2f8f5b; --err:#c0392b;
  --v:#2f6fdb; --ami:#b4448f; --mom:#1f8a8a; --misc:#6b7280;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1b222b; --fg:#e7ecf1; --muted:#93a1b0; --line:#2c3642;
  --accent:#ff7a3d; --done:#4fbf82; --err:#ff6b5b;
  --v:#6e9ff0; --ami:#e07cc0; --mom:#4cc2c2; --misc:#9aa3ae; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222b; --fg:#e7ecf1; --muted:#93a1b0; --line:#2c3642;
  --accent:#ff7a3d; --done:#4fbf82; --err:#ff6b5b;
  --v:#6e9ff0; --ami:#e07cc0; --mom:#4cc2c2; --misc:#9aa3ae; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:clamp(30px,8vw,44px);line-height:.95;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
h1 .arrow{color:var(--accent)}
.count{text-align:right}
.count b{display:block;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:40px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.overall{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);transition:width .3s}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.box-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px dashed var(--line)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.tag{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tally{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.box .bar{height:4px;border-radius:0;flex:none}
ul{list-style:none;margin:0;padding:4px 0}
li{display:flex;align-items:flex-start;gap:12px;padding:9px 14px}
li+li{border-top:1px solid var(--line)}
li input[type=checkbox]{appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border:2px solid var(--muted);border-radius:5px;cursor:pointer;display:grid;place-content:center;background:var(--surface)}
li input[type=checkbox]:checked{background:var(--done);border-color:var(--done)}
li input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
li input:focus-visible,button:focus-visible,.add input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.txt label{cursor:pointer}
.txt span{overflow-wrap:anywhere}
li.done .txt label span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.txt a{font-size:12px;color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.txt a:hover{text-decoration:underline}
.spec{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.del{flex:none;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;cursor:pointer;opacity:.5}
.del:hover{opacity:1;color:var(--accent)}
.add{display:flex;gap:8px;padding:10px 14px;border-top:1px dashed var(--line)}
.add input{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.add button{font:600 13px var(--body);border:0;border-radius:6px;padding:8px 14px;background:var(--fg);color:var(--surface);cursor:pointer}
.status{font-size:12px;color:var(--muted);min-height:16px;text-align:center}
.status.err{color:var(--err)}
.meta{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <div class="eyebrow">Moving timeline</div>
      <h1 id="title">Move Board</h1>
    </div>
    <div class="count"><b id="days">–</b><span class="eyebrow" id="daysLabel"></span></div>
  </header>
  <div class="overall"><span id="overallTxt"></span><div class="bar"><i id="overallBar"></i></div></div>
  <div id="boxes" style="display:flex;flex-direction:column;gap:14px"></div>
  <div class="status" id="status">Loading…</div>
  <div class="meta" id="meta"></div>
</div>
<script>
(function(){
  var API = '/api/state';
  var rec = null;            // { version, state, updatedAt, updatedBy } as last confirmed by the server
  var state = null;          // working copy
  var pending = [];          // ops not yet confirmed, re-applied if the server has a newer version
  var timer = null, saving = false, dirty = false;
  var colors = {v:'var(--v)',ami:'var(--ami)',mom:'var(--mom)',misc:'var(--misc)'};
  var statusEl = document.getElementById('status'), metaEl = document.getElementById('meta');

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function color(id){return colors[id] || 'var(--misc)';}
  function group(id){return state.groups.filter(function(g){return g.id===id;})[0];}
  function setStatus(msg, err){ statusEl.textContent = msg; statusEl.className = 'status' + (err ? ' err' : ''); }

  function days(){
    var p = state.move.split('-'), m = new Date(+p[0],+p[1]-1,+p[2]), n = new Date(); n.setHours(0,0,0,0);
    var d = Math.round((m-n)/864e5);
    var label = m.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
    document.getElementById('days').textContent = d > 0 ? d : (d === 0 ? 'Today' : 'Moved');
    document.getElementById('daysLabel').textContent = d > 0 ? (d===1?'day':'days')+' to '+label : label;
  }

  function render(){
    var parts = (state.title || 'Move Board').split('→');
    document.getElementById('title').innerHTML = parts.length === 2
      ? esc(parts[0].trim())+' <span class="arrow">→</span> '+esc(parts[1].trim()) : esc(state.title || 'Move Board');
    days();
    var all=0, done=0, html='';
    state.groups.forEach(function(g){
      var c = g.items.filter(function(i){return i.d;}).length, tot=g.items.length;
      all+=tot; done+=c;
      html += '<section class="box"><div class="box-head"><div class="who"><span class="dot" style="background:'+color(g.id)+'"></span><span class="tag">'+esc(g.name)+'</span></div><span class="tally">'+c+' of '+tot+' done</span></div>'
        + '<div class="bar"><i style="width:'+(tot?c/tot*100:0)+'%;background:'+color(g.id)+'"></i></div><ul>';
      g.items.forEach(function(it,ix){
        var id = 'c-'+g.id+'-'+ix;
        html += '<li class="'+(it.d?'done':'')+'"><input type="checkbox" id="'+id+'" data-g="'+g.id+'" data-i="'+ix+'"'+(it.d?' checked':'')+' aria-label="'+esc(it.t)+'">'
          + '<div class="txt"><label for="'+id+'"><span>'+esc(it.t)+'</span></label>'+(it.s?'<span class="spec">'+esc(it.s)+'</span>':'')
          + (it.u?'<a href="'+esc(it.u)+'" target="_blank" rel="noopener">Open link ↗</a>':'')+'</div>'
          + '<button class="del" data-g="'+g.id+'" data-i="'+ix+'" aria-label="Remove '+esc(it.t)+'">×</button></li>';
      });
      html += '</ul><form class="add" data-g="'+g.id+'"><input id="add-'+g.id+'" placeholder="Add to '+esc(g.name)+'…" autocomplete="off" maxlength="400"><button type="submit">Add</button></form></section>';
    });
    document.getElementById('boxes').innerHTML = html;
    document.getElementById('overallTxt').textContent = done+' / '+all+' done';
    document.getElementById('overallBar').style.width = (all?done/all*100:0)+'%';
    meta();
  }

  function meta(){
    if(!rec || !rec.updatedAt){ metaEl.textContent = ''; return; }
    var who = (rec.updatedBy || '').split('@')[0] || 'someone';
    var when = new Date(rec.updatedAt).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    metaEl.textContent = 'Last change by '+who+' · '+when;
  }

  // ---- ops: applied locally now, re-applied on top of a newer server copy on conflict ----
  function apply(op, s){
    var g = s.groups.filter(function(x){return x.id===op.g;})[0]; if(!g) return;
    if(op.type==='toggle'){ var it = g.items.filter(function(x){return x.t===op.t;})[0]; if(it) it.d = op.d; }
    else if(op.type==='add'){ if(!g.items.some(function(x){return x.t===op.t;})) g.items.push({t:op.t,d:false}); }
    else if(op.type==='del'){ var ix = g.items.map(function(x){return x.t;}).indexOf(op.t); if(ix>=0) g.items.splice(ix,1); }
  }
  function change(op){
    pending.push(op); apply(op, state); dirty = true; render();
    setStatus('Saving…');
    clearTimeout(timer); timer = setTimeout(save, 700);
  }

  function save(){
    if(saving || !dirty) return;
    saving = true; dirty = false;
    var ops = pending.slice(), version = rec.version;
    fetch(API, {method:'PUT', headers:{'content-type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({version: version, state: state})})
    .then(function(r){ return r.json().then(function(b){ return {status:r.status, body:b}; }); })
    .then(function(res){
      if(res.status===200){
        rec = res.body; pending = pending.slice(ops.length);
        if(!dirty){ state = clone(rec.state); render(); setStatus('Saved'); }
      } else if(res.status===409){
        rec = {version:res.body.version, state:res.body.state, updatedAt:res.body.updatedAt, updatedBy:res.body.updatedBy};
        state = clone(rec.state); pending.forEach(function(op){ apply(op, state); });
        dirty = true; render(); setStatus('Someone else just saved – merging…');
      } else if(res.status===401 || res.status===403){
        setStatus('Signed out – reload to sign in again.', true); dirty = true;
      } else {
        setStatus('Couldn’t save ('+res.status+'). Will retry.', true); dirty = true;
      }
    })
    .catch(function(){ setStatus('Offline – will retry when back.', true); dirty = true; })
    .then(function(){ saving = false; if(dirty){ clearTimeout(timer); timer = setTimeout(save, 2000); } });
  }

  function refresh(){
    if(dirty || saving) return;
    fetch(API, {credentials:'same-origin', cache:'no-store'}).then(function(r){
      if(r.status===401 || r.status===403){ setStatus('Signed out – reload to sign in again.', true); return; }
      if(!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function(b){
      if(!b) return;
      if(!rec || b.version !== rec.version){ rec = b; state = clone(b.state); render(); }
      if(!dirty) setStatus('Up to date');
    }).catch(function(){ if(!rec) setStatus('Couldn’t load the board. Check your connection and reload.', true); });
  }

  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  document.addEventListener('change', function(e){
    var t=e.target; if(t.type!=='checkbox'||!t.dataset.g) return;
    var it = group(t.dataset.g).items[+t.dataset.i];
    change({type:'toggle', g:t.dataset.g, t:it.t, d:t.checked});
  });
  document.addEventListener('click', function(e){
    var b=e.target.closest('.del'); if(!b) return;
    var it = group(b.dataset.g).items[+b.dataset.i];
    if(!confirm('Remove “'+it.t+'”?')) return;
    change({type:'del', g:b.dataset.g, t:it.t});
  });
  document.addEventListener('submit', function(e){
    var f=e.target.closest('.add'); if(!f) return; e.preventDefault();
    var inp=f.querySelector('input'), v=inp.value.trim(); if(!v) return;
    inp.value=''; change({type:'add', g:f.dataset.g, t:v});
  });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') refresh(); });
  window.addEventListener('focus', refresh);
  window.addEventListener('online', function(){ if(dirty) save(); else refresh(); });
  setInterval(function(){ if(document.visibilityState==='visible') refresh(); }, 60000);

  refresh();
})();
</script>
</body>
</html>
