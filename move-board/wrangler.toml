# Move Board — Cloudflare Worker config
# Deployed by scripts/deploy.sh (reads the Cloudflare token from 1Password).

name = "move-board"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# The board must only be reachable through the custom domain, which sits behind
# Cloudflare Access. No workers.dev / preview URLs, so nothing bypasses the login gate.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "move.vasantpatel.xyz", custom_domain = true }
]

[observability]
enabled = true

# Filled in by scripts/setup-access.sh once the Access application exists.
# While these are empty the worker answers 503 to everything except /healthz.
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[kv_namespaces]]
binding = "MOVE_BOARD"
id = "1e71a8fc026f470fa7640989b912ed29"
