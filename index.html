<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matt Damon Facts</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--cream:#f5f0e8;--warm-dark:#0d0d0f;--blue:#2e6be6;--blue-light:#5b8ff9;--ash:#7a7a8a;--smoke:#b0afc0;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--warm-dark);color:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse 80% 60% at 15% 20%,rgba(46,107,230,.10) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 85% 80%,rgba(91,143,249,.07) 0%,transparent 60%);pointer-events:none;}

    .page{max-width:580px;width:90%;text-align:center;padding:2rem 0;}

    .header{margin-bottom:3rem;}
    .logo-mark{font-size:40px;display:block;margin-bottom:12px;filter:drop-shadow(0 0 16px rgba(46,107,230,.4));}
    h1{font-family:'Playfair Display',serif;font-size:clamp(36px,9vw,56px);font-weight:900;letter-spacing:-.02em;line-height:.95;color:var(--cream);}
    h1 em{font-style:normal;color:var(--blue-light);}
    .subtitle{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--smoke);margin-top:10px;}

    .fact-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:36px 32px;animation:fadeUp .5s ease both;}
    .fact-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);margin-bottom:20px;}
    .fact-text{font-family:'Playfair Display',serif;font-size:clamp(18px,4vw,22px);line-height:1.65;color:var(--cream);}

    .hint{margin-top:2rem;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);opacity:.5;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div class="page">

  <div class="header">
    <span class="logo-mark">🎬</span>
    <h1>Matt <em>Damon</em></h1>
    <p class="subtitle">Facts for the devoted</p>
  </div>

  <div class="fact-card">
    <div class="fact-label">Did you know</div>
    <div class="fact-text" id="factText"></div>
  </div>

  <p class="hint">Refresh for another</p>

</div>
<script>
  const facts = [
    "Matt Damon left Harvard 12 credits short of graduating to film Good Will Hunting. Harvard eventually gave him an honorary degree, which he accepted looking extremely smug and deservedly so.",
    "He sold the Good Will Hunting screenplay for $675,000. Ben Affleck used his half to buy a leather jacket. Matt Damon used his to become Matt Damon.",
    "Damon turned down Avatar. He would have earned roughly $250 million. He once said it was 'probably a mistake.' Probably.",
    "He lost 60 pounds for Courage Under Fire by barely eating. His adrenal gland never forgave him. Neither did his personal trainer.",
    "Matt Damon has been rescued in more films than any other A-list actor — Saving Private Ryan, The Martian, Interstellar, Elysium. Hollywood keeps putting him in danger just to get him out of it.",
    "He and Ben Affleck have been best friends since age 8. They grew up two blocks apart in Cambridge, met on a baseball diamond, and have been insufferably close ever since.",
    "Jason Bourne was originally described as a 'grizzled, older spy.' Damon got the role after Doug Liman saw him in Talented Mr. Ripley and thought he had the face of someone who could kill you and apologize about it.",
    "He gained 30 pounds for The Informant! by eating cheese and drinking beer. He has described this as the most enjoyable research he has ever done.",
    "Damon trained with Navy SEALs for Green Zone. The SEALs reportedly found this delightful.",
    "He starred in The Martian, a film about a man left alone on Mars who survives by farming potatoes. Matt Damon has since refused to confirm or deny whether he knows how to grow potatoes in real life.",
    "His cameo in Eurotrip — where he plays a punk rock singer — is so brief and so unhinged that most viewers assume they imagined it. They did not.",
    "Damon co-founded water.org, which has brought clean water access to over 40 million people. He also once got roasted on 30 Rock for 14 seasons. The man contains multitudes.",
    "Forbes ranked him the most bankable star in Hollywood, meaning studios make more money per dollar spent on Matt Damon than anyone else. He is, financially speaking, a reliable appliance.",
    "He replaced Tom Hanks in Saving Private Ryan after Hanks dropped out for Cast Away. Tom Hanks was then replaced in Cast Away by a volleyball named Wilson. Everyone came out fine.",
    "Matt Damon has an IQ reported to be around 160. He used this to write Good Will Hunting, turn down Avatar, and spend 30 years being best friends with Ben Affleck. Make of that what you will.",
    "He once described his preparation for playing a CIA operative as 'mostly just looking concerned in nice coats.' Critics agreed this was very convincing.",
    "His daughter once told an interviewer that her dad is 'just a guy who watches a lot of TV.' This is the most humanizing thing ever said about Matt Damon.",
    "Damon has appeared on screen with George Clooney so many times that film historians now track it as a recurring natural phenomenon, like solar flares.",
  ];

  document.getElementById('factText').textContent = facts[Math.floor(Math.random() * facts.length)];
</script>

</body>
</html>
