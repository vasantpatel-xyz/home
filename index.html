<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vasant Patel</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--cream:#f5f0e8;--warm-dark:#0d0d0f;--blue:#2e6be6;--blue-light:#5b8ff9;--ash:#7a7a8a;--smoke:#b0afc0;--border:rgba(255,255,255,.08);}
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{font-family:'DM Sans',sans-serif;background:var(--warm-dark);color:var(--cream);display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;}
    body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse 80% 60% at 15% 20%,rgba(46,107,230,.10) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 85% 80%,rgba(91,143,249,.06) 0%,transparent 60%);pointer-events:none;}
    .card{position:relative;z-index:1;max-width:580px;width:100%;padding:0 28px;text-align:center;animation:fadeUp .6s ease both;}
    .eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);margin-bottom:28px;}
    .fact{font-family:'Playfair Display',serif;font-size:clamp(22px,5vw,34px);font-weight:700;line-height:1.25;color:var(--cream);margin-bottom:32px;min-height:3em;display:flex;align-items:center;justify-content:center;}
    .fact em{font-style:italic;color:var(--blue-light);}
    .hint{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--border);color:rgba(255,255,255,.18);cursor:default;user-select:none;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes swap{0%{opacity:1;transform:translateY(0)}30%{opacity:0;transform:translateY(-10px)}60%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
    .swapping{animation:swap .4s ease both;}
  </style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Matt Damon Fact</div>
  <div class="fact" id="fact"></div>
  <div class="hint">Refresh for another</div>
</div>
<script>
  const facts = [
    "Matt Damon wrote the <em>Good Will Hunting</em> screenplay at 25. You were 25 once. What did you write?",
    "Matt Damon lost 40 lbs for <em>Courage Under Fire</em>, on his own, without a trainer, and it wrecked his adrenal gland. Method acting has consequences.",
    "He turned down the role of <em>Avatar</em> and walked away from a $250M payday. Most people can't say no to a free lunch.",
    "Matt Damon graduated from Harvard — he just never bothered to pick up the diploma. A flex so quiet it's almost offensive.",
    "He was an uncredited extra in <em>Field of Dreams</em>. Before Good Will Hunting, he was literally background noise.",
    "Matt Damon has been named <em>People</em>'s Sexiest Man Alive. Ben Affleck has not. They are still friends, allegedly.",
    "He survived being stranded on Mars in <em>The Martian</em>, Antarctica in <em>Interstellar</em>, and Normandy in <em>Saving Private Ryan</em>. The man refuses to stay lost.",
    "Matt Damon once hosted <em>Project Greenlight</em>, a show about giving unknown filmmakers a chance — while being one of the most famous filmmakers alive.",
    "He's fluent enough in Spanish that he raises his kids bilingual. His wife is Argentinian. The man commits.",
    "Matt Damon turned down <em>The Bourne Identity</em> the first time. Then read the script again. Changed his mind. Became an action star at 31.",
    "He was <em>almost</em> in Lord of the Rings as Faramir. We got David Wenham. The timeline is still recovering.",
    "Matt Damon wrote a role specifically so he could work with Jack Nicholson. The role was in <em>The Departed</em>. It worked.",
    "He did <em>Elysium</em>, <em>Downsizing</em>, and <em>Suburbicon</em> in a row — three swings, three misses — and came back with <em>Ford v Ferrari</em>. Resilience is a skill.",
    "Matt Damon's net worth is estimated at $170M. His <em>Good Will Hunting</em> paycheck was $600K. Compound interest, but make it career.",
    "He once crashed a <em>Project Runway</em> episode just to say hi to Tim Gunn. Nobody asked him to. He just did it.",
    "Matt Damon canonically saved <em>three</em> planets and survived all of them. NASA has quietly noted this is unrealistic.",
    "He plays poker seriously. Like, actually seriously. He studied for <em>Rounders</em> and never fully stopped.",
    "Matt Damon has more Oscar wins than Leonardo DiCaprio did before <em>The Revenant</em>. He's never once brought this up. Probably.",
  ];

  const el = document.getElementById('fact');
  const idx = Math.floor(Math.random() * facts.length);
  el.innerHTML = facts[idx];
</script>
</body>
</html>
